<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="WhatsApp Status Maker">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31b877"/>
      <stop offset="1" stop-color="#16764a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- A status ring, broken the way an unseen update is drawn, around a play mark.
       Two shapes only: at 16 pixels anything finer turns to mud. -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-opacity=".55"
          stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="24 7" transform="rotate(-72 32 32)"/>
  <path d="M26.5 22.8 44 32 26.5 41.2Z" fill="#ffffff"/>
</svg>
