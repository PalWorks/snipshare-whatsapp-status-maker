<section class="admin" id="admin" data-token="{{TOKEN}}" data-site="{{SITE}}">
  <header class="page-head">
    <h1>Admin</h1>
    <div class="range">
      <div class="segmented" role="radiogroup" aria-label="Which days" id="range">
        <button type="button" role="radio" class="segmented__option" aria-checked="true" data-range="1">Today</button>
        <button type="button" role="radio" class="segmented__option" aria-checked="false" data-range="7">7 days</button>
        <button type="button" role="radio" class="segmented__option" aria-checked="false" data-range="30">30 days</button>
        <button type="button" role="radio" class="segmented__option" aria-checked="false" data-range="custom">Custom</button>
      </div>
      <form class="range__custom" id="custom" novalidate hidden>
        <label>From <input type="date" id="from"></label>
        <label>To <input type="date" id="to"></label>
        <button type="submit" class="button button--small">Show</button>
      </form>
      <p class="hint" id="range-label" role="status"></p>
    </div>
  </header>

  <div class="stats stats--five" id="stats">
    <div class="stat"><span class="skeleton" style="height:44px"></span></div>
    <div class="stat"><span class="skeleton" style="height:44px"></span></div>
    <div class="stat"><span class="skeleton" style="height:44px"></span></div>
    <div class="stat"><span class="skeleton" style="height:44px"></span></div>
    <div class="stat"><span class="skeleton" style="height:44px"></span></div>
  </div>
  <p class="hint system" id="system"></p>

  <section aria-labelledby="h-pending">
    <div class="section-head"><h2 id="h-pending">Requests <span class="count" id="n-pending"></span></h2></div>
    <div class="requests" id="pending"><span class="skeleton" style="height:96px"></span></div>
  </section>

  <section aria-labelledby="h-people">
    <div class="section-head">
      <h2 id="h-people">People <span class="count" id="n-people"></span></h2>
      <button type="button" class="button button--small" id="add-open">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        Add person</button>
    </div>
    <form class="card addrow" id="add" novalidate hidden>
      <div class="addrow__fields">
        <label class="sr-only" for="add-email">Their Google account's email</label>
        <input id="add-email" type="email" inputmode="email" autocomplete="off" required
               placeholder="Their Google account's email">
        <label class="sr-only" for="add-name">Name (optional)</label>
        <input id="add-name" type="text" autocomplete="off" placeholder="Name (optional)">
        <button type="button" class="button button--small" id="add-cancel">Cancel</button>
        <button type="submit" class="button button--small button--primary" id="add-save">Let them in</button>
      </div>
      <p class="error" id="add-error" role="alert" hidden></p>
    </form>
    <div class="toolbar">
      <label class="sr-only" for="people-search">Search people</label>
      <input type="search" id="people-search" placeholder="Search by name or email" autocomplete="off">
      <div class="chipset" role="group" aria-label="Show" id="people-filter">
        <button type="button" class="chip" aria-pressed="true" data-filter="all">All</button>
        <button type="button" class="chip" aria-pressed="false" data-filter="approved">Approved</button>
        <button type="button" class="chip" aria-pressed="false" data-filter="suspended">Suspended</button>
        <button type="button" class="chip" aria-pressed="false" data-filter="declined">Declined</button>
      </div>
    </div>
    <div class="rows card" id="people"><div class="row"><span class="skeleton" style="height:44px;grid-column:1/-1"></span></div></div>
  </section>

  <section aria-labelledby="h-usage">
    <div class="section-head"><h2 id="h-usage">Usage</h2></div>
    <div class="table-wrap"><table id="usage"></table></div>
  </section>

  <section aria-labelledby="h-reports">
    <div class="section-head"><h2 id="h-reports">Failures and feedback <span class="count" id="n-reports"></span></h2></div>
    <div class="rows card feed" id="reports"></div>
  </section>
</section>
<script src="/admin.js"></script>
